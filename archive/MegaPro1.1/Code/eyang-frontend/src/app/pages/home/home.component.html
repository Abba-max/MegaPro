<div class="home-container fade-in">
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Trouvez votre logement étudiant idéal</h1>
            <p class="hero-subtitle">Des chambres de qualité, proches des campus, avec tous les équipements nécessaires.
            </p>

            <div class="hero-tags mt-6">
                <div class="hero-tag">
                    <lucide-icon [img]="CheckIcon" class="tag-icon"></lucide-icon>
                    <span>Vérifiés</span>
                </div>
                <div class="hero-tag">
                    <lucide-icon [img]="LockIcon" class="tag-icon"></lucide-icon>
                    <span>Sécurisés</span>
                </div>
                <div class="hero-tag">
                    <lucide-icon [img]="ZapIcon" class="tag-icon"></lucide-icon>
                    <span>Rapide</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filter Bar -->
    <div class="filter-bar-container">
        <div class="filter-bar glass">
            <div class="filter-items">
                <button class="filter-item border">
                    <lucide-icon [img]="FilterIcon" class="filter-icon"></lucide-icon>
                    <span>Filtres</span>
                </button>
                <button class="filter-item">
                    <lucide-icon [img]="WifiIcon" class="filter-icon orange"></lucide-icon>
                    <span>WiFi</span>
                </button>
                <button class="filter-item">
                    <lucide-icon [img]="CoffeeIcon" class="filter-icon gray"></lucide-icon>
                    <span>Restaurant</span>
                </button>
                <button class="filter-item">
                    <lucide-icon [img]="ZapIcon" class="filter-icon yellow"></lucide-icon>
                    <span>Générateur</span>
                </button>
                <button class="filter-item">
                    <lucide-icon [img]="DropletsIcon" class="filter-icon blue"></lucide-icon>
                    <span>Forage</span>
                </button>
                <button class="filter-item">
                    <lucide-icon [img]="StarIcon" class="filter-icon yellow"></lucide-icon>
                    <span>4+ étoiles</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Listings Section -->
    <section class="listings-section mt-12">
        <div class="section-header">
            <h2 class="section-title">Logements disponibles</h2>
            <span class="listing-count">{{housings.length}} logements</span>
        </div>

        <div class="listings-grid mt-8">
            <div class="housing-card card fade-in" *ngFor="let h of housings" [routerLink]="['/housing', h.id]"
                style="cursor: pointer;">
                <div class="card-image-area">
                    <div class="badges-overlay">
                        <span class="badge-green" *ngIf="h.places">{{h.places}} places</span>
                        <div class="badge-rating" *ngIf="h.rating">
                            <lucide-icon [img]="StarIcon" class="icon-star"></lucide-icon>
                            <span>{{h.rating}}</span>
                        </div>
                    </div>

                    <div class="image-wrapper" [class.no-image]="!h.image">
                        <img *ngIf="h.image" [src]="h.image" [alt]="h.title">
                        <div class="placeholder-content" *ngIf="!h.image">
                            <lucide-icon [img]="BuildingIcon" class="icon-building"></lucide-icon>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <h3 class="housing-title">{{h.title}}</h3>

                    <div class="housing-meta mt-1">
                        <lucide-icon [img]="MapPinIcon" class="icon-xs"></lucide-icon>
                        <span>{{h.distance}}</span>
                    </div>

                    <div class="features-row mt-3">
                        <lucide-icon *ngIf="h.features.includes('wifi')" [img]="WifiIcon"
                            class="feature-icon orange"></lucide-icon>
                        <lucide-icon *ngIf="h.features.includes('water') || h.features.includes('droplets')"
                            [img]="DropletsIcon" class="feature-icon blue"></lucide-icon>
                        <lucide-icon *ngIf="h.features.includes('zap')" [img]="ZapIcon"
                            class="feature-icon yellow"></lucide-icon>
                    </div>

                    <div class="price-row mt-4">
                        <span class="price-amount">{{h.price | number}} FCFA</span>
                        <span class="price-period">/mois</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
