<div class="page-header">
    <div class="flex justify-between items-center w-full">
        <div>
            <h1 class="page-title">Gestion des utilisateurs</h1>
        </div>
        <button class="btn btn-primary">
            <lucide-icon [img]="PlusIcon" class="icon-sm mr-2"></lucide-icon>
            Ajouter
        </button>
    </div>
</div>

    <div class="card mt-8">
    <div class="p-4 border-b bg-gray-50">
        <div class="search-input-group">
            <lucide-icon [img]="SearchIcon" class="search-icon"></lucide-icon>
            <input type="text" placeholder="Rechercher un utilisateur..." class="search-input">
        </div>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>Utilisateur</th>
                <th>Email</th>
                <th>Type</th>
                <th>Statut</th>
                <th class="text-right">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let u of users" class="fade-in">
                <td data-label="Utilisateur">
                    <div class="user-cell">
                        <div class="avatar-sm" [style.background]="u.color">{{u.initials}}</div>
                        <span class="user-name">{{u.name}}</span>
                    </div>
                </td>
                <td data-label="Email"><span class="text-sm">{{u.email}}</span></td>
                <td data-label="Type">
                    <div class="role-badge" [class.student]="u.type === 'Étudiant'"
                        [class.parent]="u.type === 'Parent'"
                        [class.owner]="u.type === 'Propriétaire'"
                        [class.admin]="u.type === 'Admin'">
                        <span>{{u.type}}</span>
                    </div>
                </td>
                <td data-label="Statut">
                    <span class="badge badge-success">
                        {{u.active ? 'Actif' : 'Inactif'}}
                    </span>
                </td>
                <td class="text-right" data-label="Actions">
                    <button class="action-link" *ngIf="u.active">Désactiver</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
