<div class="page-header">
    <div class="flex justify-between items-center w-full">
        <div>
            <h1 class="page-title">Gestion des logements</h1>
        </div>
        <button class="btn btn-primary">
            <lucide-icon [img]="PlusIcon" class="icon-sm mr-2"></lucide-icon>
            Ajouter
        </button>
    </div>
</div>

<div class="card mt-8">
    <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <div class="search-input-group">
            <lucide-icon [img]="SearchIcon" class="search-icon"></lucide-icon>
            <input type="text" placeholder="Rechercher par titre, ville..." class="search-input">
        </div>
        <div class="flex gap-4">
            <select class="select-input">
                <option>Tous les statuts</option>
                <option>Disponible</option>
                <option>Occupé</option>
                <option>En attente</option>
            </select>
            <button class="btn-secondary flex items-center gap-2">
                <lucide-icon [img]="FilterIcon" class="icon-sm"></lucide-icon>
                Filtrer
            </button>
        </div>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>LOGEMENT</th>
                <th>PRIX</th>
                <th>PLACES</th>
                <th>NOTE</th>
                <th>STATUT</th>
                <th class="text-right">ACTIONS</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let l of housings" class="fade-in">
                <td data-label="LOGEMENT">
                    <span class="housing-title">{{l.title}}</span>
                </td>
                <td data-label="PRIX"><span class="font-bold text-sm">{{l.price | number}} FCFA</span></td>
                <td data-label="PLACES"><span class="text-sm">{{l.places}}</span></td>
                <td data-label="NOTE">
                    <div class="rating-cell" *ngIf="l.rating">
                        <lucide-icon [img]="StarIcon" class="icon-xs gold"></lucide-icon>
                        <span>{{l.rating}}</span>
                    </div>
                    <span class="text-sm" *ngIf="!l.rating">-</span>
                </td>
                <td data-label="STATUT">
                    <span class="badge badge-success">
                        {{l.status}}
                    </span>
                </td>
                <td class="text-right" data-label="ACTIONS">
                    <button class="action-link delete-link">Supprimer</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
