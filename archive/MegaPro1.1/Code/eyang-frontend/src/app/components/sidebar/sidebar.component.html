<aside class="sidebar">
    <div class="sidebar-header">
        <div class="admin-badge">
            <lucide-icon [img]="DashboardIcon" class="icon-xs"></lucide-icon>
            <span>Administration</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <ul class="nav-links">
            <li>
                <a routerLink="/admin/overview" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="DashboardIcon" class="nav-icon"></lucide-icon>
                    <span>Vue d'ensemble</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="UsersIcon" class="nav-icon"></lucide-icon>
                    <span>Utilisateurs</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/logements" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="HomeIcon" class="nav-icon"></lucide-icon>
                    <span>Logements</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/bookings" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="CalendarIcon" class="nav-icon"></lucide-icon>
                    <span>Réservations</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/reviews" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="StarIcon" class="nav-icon"></lucide-icon>
                    <span>Avis</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/reports" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="ReportsIcon" class="nav-icon"></lucide-icon>
                    <span>Rapports</span>
                </a>
            </li>
            <li>
                <a routerLink="/admin/settings" routerLinkActive="active" class="nav-link">
                    <lucide-icon [img]="SettingsIcon" class="nav-icon"></lucide-icon>
                    <span>Paramètres</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <div class="menu-divider"></div>
        <button class="footer-btn">
            <lucide-icon [img]="LogOutIcon" class="nav-icon"></lucide-icon>
            <span>Déconnexion</span>
        </button>
        <button class="footer-btn primary-btn">
            <lucide-icon [img]="GlobeIcon" class="nav-icon"></lucide-icon>
            <span>Retour au site</span>
        </button>
    </div>
</aside>
