<div class="auth-page-wrapper">
    <div class="auth-bg-overlay"></div>

    <div class="auth-container fade-in">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="brand-logo" routerLink="/">
                    <img src="/assets/images/logo.png" alt="Eyang Estate">
                </div>
                <h1 class="auth-title">{{ 'auth.forgot_password_title' | translate }}</h1>
                <p class="auth-subtitle">{{ 'auth.forgot_password_subtitle' | translate }}</p>
            </div>

            <div class="auth-card-body">
                <form (ngSubmit)="handleSubmit()" class="auth-form">
                    <div class="form-group-modern">
                        <div class="input-wrapper">
                            <lucide-icon [img]="MailIcon" class="input-icon"></lucide-icon>
                            <input type="email" [(ngModel)]="email" name="email"
                                [placeholder]="'auth.login_identifier_placeholder' | translate" 
                                class="modern-input" required>
                        </div>
                    </div>

                    <div class="success-area mt-4" *ngIf="successMessage">
                        <p class="success-msg">{{ successMessage }}</p>
                    </div>

                    <div class="error-area mt-4" *ngIf="error">
                        <p class="error-msg">{{ error }}</p>
                    </div>

                    <button type="submit" class="btn-auth-primary mt-6" [disabled]="isLoading() || successMessage !== ''">
                        <span *ngIf="!isLoading()">{{ 'auth.send_reset_link' | translate }}</span>
                        <div class="loader-white" *ngIf="isLoading()"></div>
                        <lucide-icon *ngIf="!isLoading()" [img]="ArrowRightIcon" class="btn-icon"></lucide-icon>
                    </button>
                </form>
            </div>

            <div class="auth-card-footer mt-4">
                <a routerLink="/login" class="auth-link back-to-login">
                    <lucide-icon [img]="ArrowLeftIcon" class="icon-xs mr-2"></lucide-icon>
                    {{ 'auth.back_to_login' | translate }}
                </a>
            </div>
        </div>

        <div class="auth-legal-links">
            <a href="#">{{ 'auth.privacy_policy' | translate }}</a>
            <span class="dot"></span>
            <a href="#">{{ 'auth.terms_of_service' | translate }}</a>
        </div>
    </div>
</div>
