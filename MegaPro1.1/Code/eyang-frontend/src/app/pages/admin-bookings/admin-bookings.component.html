<div class="page-header">
    <h1 class="page-title">Gestion des réservations</h1>
</div>

<div class="card mt-8">
    <table class="table">
        <thead>
            <tr>
                <th>LOGEMENT</th>
                <th>CLIENT</th>
                <th>DATE</th>
                <th>STATUT</th>
                <th class="text-right">ACTIONS</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let booking of bookings" class="fade-in">
                <td data-label="LOGEMENT">
                    <span class="booking-title">{{booking.property}}</span>
                </td>
                <td data-label="CLIENT"><span class="text-sm">{{booking.client}}</span></td>
                <td data-label="DATE"><span class="text-sm">{{booking.date}}</span></td>
                <td data-label="STATUT">
                    <span class="status-badge" [class.pending]="booking.status === 'En attente'"
                        [class.accepted]="booking.status === 'Acceptée'"
                        [class.refused]="booking.status === 'Refusée'">
                        {{booking.status}}
                    </span>
                </td>
                <td class="text-right" data-label="ACTIONS">
                    <div class="action-buttons" *ngIf="booking.status === 'En attente'">
                        <button class="action-link accept-link">Accepter</button>
                        <button class="action-link refuse-link">Refuser</button>
                    </div>
                    <span class="text-sm" *ngIf="booking.status !== 'En attente'">-</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
