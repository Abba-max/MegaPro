<!-- Toast -->
<div class="toast-container">
    <div *ngFor="let t of toasts" class="toast" [class]="'toast-' + t.type" (click)="dismissToast(t.id)">
        <lucide-icon [img]="CheckCircleIcon" class="toast-icon" *ngIf="t.type==='success'"></lucide-icon>
        <lucide-icon [img]="XCircleIcon" class="toast-icon" *ngIf="t.type==='error'"></lucide-icon>
        <lucide-icon [img]="InfoIcon" class="toast-icon" *ngIf="t.type==='info'"></lucide-icon>
        <lucide-icon [img]="AlertIcon" class="toast-icon" *ngIf="t.type==='warning'"></lucide-icon>
        <span class="toast-msg">{{ t.message }}</span>
        <span class="toast-close">×</span>
    </div>
</div>

<div class="page-header">
<h1 class="page-title">Gestion des avis</h1>
</div>

<div *ngIf="isLoading()" class="loader-row">
    <lucide-icon [img]="LoaderIcon" class="spin-icon"></lucide-icon>
    <span>Chargement…</span>
</div>
<div class="card mt-8" *ngIf="!isLoading()">
    <div class="toolbar">
        <div class="search-group">
            <lucide-icon [img]="SearchIcon" class="search-icon-abs"></lucide-icon>
            <input type="text" [(ngModel)]="searchQuery" (input)="applyFilter()"
                [placeholder]="'admin.search_reviews_ph' | translate" class="search-input">
        </div>
    <select class="select-input" [(ngModel)]="filterRating" (change)="applyFilter()">
        <option value="">Toutes les notes</option>
        <option value="5">⭐ 5 étoiles</option>
        <option value="4">⭐ 4 étoiles</option>
        <option value="3">⭐ 3 étoiles</option>
        <option value="2">⭐ 2 étoiles</option>
        <option value="1">⭐ 1 étoile</option>
    </select>
    <span class="total-badge">{{ filtered.length }} avis</span>
    </div>
<table class="table">
    <thead>
        <tr>
            <th>AUTEUR</th>
            <th>LOGEMENT</th>
            <th>NOTE</th>
            <th>COMMENTAIRE</th>
            <th>DATE</th>
            <th class="text-right">ACTIONS</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let r of filtered" class="fade-in">
            <td data-label="AUTEUR">
                <div class="author-cell">
                    <div class="avatar-sm">{{ r.initials }}</div>
                    <div>
                        <div class="booking-title">{{ r.name }}</div>
                        <div class="meta-sub" *ngIf="r.user_email">{{ r.user_email }}</div>
            </div>
        </div>
        </td>
        <td data-label="LOGEMENT"><span class="text-sm">{{ r.estate_name }}</span></td>
        <td data-label="NOTE">
            <div class="stars-row">
                <lucide-icon [img]="StarIcon" class="star-filled" *ngFor="let s of getStarArray(r.rating)"></lucide-icon>
                <lucide-icon [img]="StarIcon" class="star-empty" *ngFor="let s of getEmptyStars(r.rating)"></lucide-icon>
                <span class="rating-num">{{ r.rating }}/5</span>
        </div>
        </td>
        <td data-label="COMMENTAIRE">
            <span class="comment-text">{{ r.comment }}</span>
        </td>
        <td data-label="DATE"><span class="text-sm">{{ formatDate(r.created_at) }}</span></td>
        <td class="text-right" data-label="ACTIONS">
            <button class="icon-btn danger" (click)="delete(r)" title="Supprimer">
                <lucide-icon [img]="TrashIcon" class="icon-xs"></lucide-icon>
            </button>
        </td>
        </tr>
        <tr *ngIf="filtered.length === 0">
            <td colspan="6" class="empty-row">Aucun avis trouvé.</td>
        </tr>
        </tbody>
        </table>
</div>
