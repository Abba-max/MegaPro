<div class="page-header">
    <h1 class="page-title">Paramètres</h1>
</div>

<div class="settings-grid mt-8">
    <!-- General Settings -->
    <div class="card p-6">
        <h2 class="card-title">Paramètres généraux</h2>
        <div class="form-group">
            <label>Nom de la plateforme</label>
            <input type="text" value="Eyang Estate" class="input">
        </div>
        <div class="form-group">
            <label>Email de contact</label>
            <input type="email" value="contact@eyangestate.com" class="input">
        </div>
        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" value="+237 6XX XXX XXX" class="input">
        </div>
    </div>

    <!-- Notifications -->
    <div class="card p-6">
        <h2 class="card-title">Notifications</h2>
        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" checked>
                <span>Notifications par email</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" checked>
                <span>Nouvelles réservations</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" checked>
                <span>Nouveaux avis</span>
            </label>
        </div>
    </div>
</div>

<div class="mt-8">
    <button class="btn btn-primary btn-large">Enregistrer les modifications</button>
</div>
