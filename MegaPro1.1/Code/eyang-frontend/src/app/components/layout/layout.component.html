<div class="app-layout">

  <!-- ── Dark overlay (mobile/tablet only, admin sidebar) ── -->
  <div class="sidebar-overlay"
       *ngIf="isAdmin && sidebarOpen"
       (click)="closeSidebar()">
  </div>

  <!-- ── Sidebar (Admin only) ─────────────────────────────── -->
  <app-sidebar
    *ngIf="isAdmin"
    [isOpen]="sidebarOpen"
    (closeRequest)="closeSidebar()">
  </app-sidebar>

  <!-- ── Main wrapper ──────────────────────────────────────── -->
  <div class="main-wrapper" [class.with-sidebar]="isAdmin">

    <!-- Hamburger button – only on ≤1024 px, admin only -->
    <button class="mobile-menu-toggle"
            *ngIf="isAdmin"
            (click)="toggleSidebar()"
            [class.toggle-open]="sidebarOpen"
            aria-label="Toggle menu">
      <!-- Animated bars → X -->
      <span class="ham-bar bar-top"    [class.open]="sidebarOpen"></span>
      <span class="ham-bar bar-mid"    [class.open]="sidebarOpen"></span>
      <span class="ham-bar bar-bottom" [class.open]="sidebarOpen"></span>
    </button>

    <app-header [isAdmin]="isAdmin" [isPublic]="isPublic"></app-header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
