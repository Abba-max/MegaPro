version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: Estatedb
      POSTGRES_USER: estateuser
      POSTGRES_PASSWORD: 1234567
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 project.asgi:application"
    environment:
      - DATABASE_URL=postgres://estateuser:1234567@db:5432/Estatedb
      - ALLOWED_HOSTS=*
      # Update CSRF_TRUSTED_ORIGINS with your VPS IP/Domain once deployed
      - CSRF_TRUSTED_ORIGINS=http://localhost:3005,http://127.0.0.1:3005
      - REQUIRE_DB_SSL=False
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-key-change-me
    volumes:
      - media_data:/app/media
      - static_data:/app/static_cdn
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./MegaPro1.1/Code/eyang-frontend
    ports:
      - "3005:80"
    volumes:
      # Mount the volumes so Nginx can serve these files directly
      - media_data:/app/media
      - static_data:/app/static_cdn
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
